services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-604800000}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    hostname: producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TEST_TOPIC: ${KAFKA_TEST_TOPIC:-observatorio-test}
      KAFKA_LIVE_TOPIC: ${KAFKA_LIVE_TOPIC:-observatorio-usgs-live}
      KAFKA_REPLAY_TOPIC: ${KAFKA_REPLAY_TOPIC:-observatorio-usgs-replay}
      KAFKA_TEST_PARTITIONS: ${KAFKA_TEST_PARTITIONS:-1}
      KAFKA_TEST_REPLICATION_FACTOR: ${KAFKA_TEST_REPLICATION_FACTOR:-1}
      KAFKA_PUBLISH_TIMEOUT_SECONDS: ${KAFKA_PUBLISH_TIMEOUT_SECONDS:-10}
      USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
      USGS_POLL_INTERVAL_SECONDS: ${USGS_POLL_INTERVAL_SECONDS:-60}
      USGS_REQUEST_TIMEOUT_SECONDS: ${USGS_REQUEST_TIMEOUT_SECONDS:-30}
      USGS_MAX_ATTEMPTS: ${USGS_MAX_ATTEMPTS:-3}
      USGS_ORIGINALS_DIR: ${USGS_ORIGINALS_DIR:-/evidence/002-ingesta-usgs-persistencia/originals}
      USGS_LIVE_ORIGINAL_RETENTION_DAYS: ${USGS_LIVE_ORIGINAL_RETENTION_DAYS:-30}
      USGS_HISTORICAL_DIR: ${USGS_HISTORICAL_DIR:-/evidence/002-ingesta-usgs-persistencia/historical}
      USGS_HISTORICAL_LIMIT: ${USGS_HISTORICAL_LIMIT:-20000}
    volumes:
      - ./evidence:/evidence
      - ./frontend/public/datos/paises.geojson:/app/catalog/paises.geojson:ro
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "/app/src/main.py", "serve"]
    healthcheck:
      test: ["CMD", "python", "/app/src/healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    hostname: consumer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TEST_TOPIC: ${KAFKA_TEST_TOPIC:-observatorio-test}
      KAFKA_LIVE_TOPIC: ${KAFKA_LIVE_TOPIC:-observatorio-usgs-live}
      KAFKA_REPLAY_TOPIC: ${KAFKA_REPLAY_TOPIC:-observatorio-usgs-replay}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      COUNTRY_CATALOG_PATH: /app/catalog/paises.geojson
      USGS_LIVE_ORIGINAL_RETENTION_DAYS: ${USGS_LIVE_ORIGINAL_RETENTION_DAYS:-30}
    volumes:
      - ./evidence:/evidence
      - ./frontend/public/datos/paises.geojson:/app/catalog/paises.geojson:ro
    depends_on:
      producer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "/app/src/main.py", "serve"]
    healthcheck:
      test: ["CMD", "python", "/app/src/healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    hostname: api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./evidence/002-ingesta-usgs-persistencia:/evidence/002-ingesta-usgs-persistencia:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kafka-data:
  postgres-data:
